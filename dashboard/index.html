<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>SelfHeal — Live Dashboard</title>
<script src="/socket.io/socket.io.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0b0d;--bg1:#101013;--bg2:#141418;--bg3:#18181d;--bg4:#1c1c22;--bg5:#222229;
  --b:rgba(255,255,255,0.05);--b2:rgba(255,255,255,0.09);--b3:rgba(255,255,255,0.14);
  --g:#00ff6a;--g2:#00e85f;--g3:#00b84c;
  --gd:rgba(0,255,106,0.10);--gg:0 0 14px rgba(0,255,106,0.35),0 2px 8px rgba(0,0,0,0.5);
  --r:#ff3d3d;--rd:rgba(255,61,61,0.10);
  --a:#ffb800;--ad:rgba(255,184,0,0.10);
  --bl:#4B9EFF;--bld:rgba(75,158,255,0.10);
  --t0:#e8e8e8;--t1:#888;--t2:#444;--t3:#2a2a2a;
  --sans:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;
  --sh:0 4px 20px rgba(0,0,0,0.7),0 1px 3px rgba(0,0,0,0.5);
}
html,body{height:100%;background:var(--bg);color:var(--t0);font-family:var(--sans);font-size:13px;overflow:hidden}
button{cursor:pointer;border:none;outline:none;font-family:var(--sans)}
input,select{outline:none;font-family:var(--mono)}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bg5);border-radius:2px}
#root{height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* Shared */
.pill{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border-radius:3px;font-size:8.5px;font-weight:700;font-family:var(--mono);letter-spacing:.04em}
.pill.pass{background:var(--gd);color:var(--g)}.pill.fail{background:var(--rd);color:var(--r)}.pill.healed{background:var(--ad);color:var(--a)}.pill.info{background:var(--bld);color:var(--bl)}
.dot{width:4px;height:4px;border-radius:50%;background:currentColor}

/* Nav */
.nav{display:flex;align-items:center;height:46px;padding:0 16px;background:var(--bg1);border-bottom:1px solid var(--b);flex-shrink:0;position:relative}
.nav::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,255,106,.2),transparent)}
.logo{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--g)}
.logo-icon{width:24px;height:24px;border-radius:5px;border:1.5px solid var(--g3);display:flex;align-items:center;justify-content:center;font-size:12px;background:var(--gd);box-shadow:0 0 12px rgba(0,255,136,.2)}
.nav-tabs{display:flex;gap:1px;margin-left:24px}
.nav-tab{padding:5px 12px;border-radius:5px;font-size:11.5px;font-weight:500;color:var(--t1);background:transparent;transition:all .15s;position:relative}
.nav-tab:hover{color:var(--t0);background:var(--bg3)}
.nav-tab.active{color:var(--g);background:var(--gd)}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.conn{display:flex;align-items:center;gap:5px;padding:3px 8px;border-radius:20px;background:var(--bg3);border:1px solid var(--b);font-size:10px;font-family:var(--mono);color:var(--t1)}
.conn-dot{width:6px;height:6px;border-radius:50%;background:var(--t2)}
.conn-dot.live{background:var(--g);box-shadow:0 0 6px var(--g)}

/* Layout */
.body{flex:1;display:flex;min-height:0;overflow:hidden}
.sidebar{width:240px;flex-shrink:0;background:var(--bg1);border-right:1px solid var(--b);display:flex;flex-direction:column;overflow:hidden}
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.section-hdr{padding:10px 14px;font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--t2);border-bottom:1px solid var(--b);display:flex;align-items:center;justify-content:space-between}
.scroll{flex:1;overflow-y:auto;padding:8px}

/* Stat Panel */
.stats{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--b);flex-shrink:0}
.stat{flex:1;background:linear-gradient(180deg,#1c1c1f,#060608);border:1px solid var(--b2);border-radius:8px;padding:10px 14px;position:relative;overflow:hidden}
.stat::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,var(--g),transparent 60%)}
.stat-num{font-family:var(--mono);font-size:24px;font-weight:700;line-height:1}
.stat-num.g{color:var(--g);text-shadow:0 0 10px rgba(0,255,106,.25)}.stat-num.r{color:var(--r)}.stat-num.a{color:var(--a)}
.stat-label{font-size:9px;color:var(--t2);text-transform:uppercase;letter-spacing:.05em;margin-top:4px}

/* Fragility row */
.frag-row{display:flex;align-items:center;gap:7px;padding:4px 8px;border-radius:4px;margin-bottom:2px}
.frag-row:hover{background:var(--bg3)}
.frag-sel{font-family:var(--mono);font-size:9.5px;color:var(--t1);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frag-bar{width:60px;height:3px;background:var(--bg5);border-radius:2px;flex-shrink:0}
.frag-fill{height:100%;border-radius:2px}
.frag-fill.lo{background:var(--g)}.frag-fill.md{background:var(--a)}.frag-fill.hi{background:var(--r)}
.risk{font-size:8px;font-weight:700;padding:1px 4px;border-radius:3px;font-family:var(--mono)}.risk.lo{background:var(--gd);color:var(--g)}.risk.md{background:var(--ad);color:var(--a)}.risk.hi{background:var(--rd);color:var(--r)}

/* Log table */
.log-wrap{flex:1;overflow-y:auto}
table.log{width:100%;border-collapse:collapse}
table.log th{position:sticky;top:0;z-index:1;padding:4px 12px;text-align:left;font-size:8.5px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.07em;background:var(--bg1);border-bottom:1px solid var(--b)}
table.log td{padding:5px 12px;font-size:10.5px;font-family:var(--mono);border-bottom:1px solid rgba(255,255,255,.025);color:var(--t1);white-space:nowrap}
table.log tr:hover td{background:var(--bg2)}
@keyframes rowIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.row-new{animation:rowIn .2s ease}

/* Heal card */
.heal-card{background:linear-gradient(180deg,#1c1c1f,#060608);border:1px solid var(--b);border-radius:6px;padding:10px;margin-bottom:6px}
.heal-from{font-family:var(--mono);font-size:9px;color:var(--r);text-decoration:line-through;opacity:.8}
.heal-to{font-family:var(--mono);font-size:10px;color:var(--g);font-weight:600;margin-top:2px}
.heal-reason{font-size:9px;color:var(--t2);margin-top:4px;line-height:1.3}
.conf-track{height:3px;background:var(--bg5);border-radius:2px;overflow:hidden;margin-top:6px}
.conf-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--g3),var(--g));transition:width .7s}
.conf-fill.low{background:linear-gradient(90deg,#800,var(--r))}
.conf-val{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--g);margin-top:3px}.conf-val.low{color:var(--r)}

/* Buttons */
.btn{padding:7px 16px;border-radius:6px;font-size:11px;font-weight:600;transition:.15s}
.btn-g{background:linear-gradient(135deg,#00ff6a,#00cc52);color:#000;box-shadow:var(--gg)}.btn-g:hover{box-shadow:0 0 20px rgba(0,255,106,.45)}
.btn-r{background:linear-gradient(135deg,#ff3d3d,#cc2020);color:#fff}.btn-r:hover{box-shadow:0 0 18px rgba(255,61,61,.45)}
.btn-o{background:transparent;color:var(--t1);border:1px solid var(--b2)}.btn-o:hover{border-color:var(--g);color:var(--g)}

/* Ticker */
.ticker{display:flex;align-items:center;height:32px;background:linear-gradient(180deg,#222226,#060608);border-top:1px solid var(--b);border-bottom:1px solid var(--g);box-shadow:0 -3px 12px rgba(0,0,0,.6);flex-shrink:0;padding:0 8px}
.tk{display:flex;align-items:center;gap:10px;padding:0 14px;border-right:1px solid var(--b2);height:70%;font-size:10px;font-family:var(--mono);white-space:nowrap}
.tk-key{color:var(--t2);letter-spacing:1px;font-weight:500}
.tk-val{font-weight:700;font-size:11px}
.tk-val.g{color:var(--g);text-shadow:0 0 10px rgba(0,255,106,.25)}.tk-val.r{color:var(--r)}.tk-val.a{color:var(--a)}
.tk-spacer{flex:1}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;

/* ═══ SOCKET CONNECTION ═══ */
let io_socket=null;
function getSocket(){
  if(!io_socket){
    io_socket=io(window.location.origin,{timeout:4000,reconnectionDelay:1000});
  }
  return io_socket;
}

/* ═══ APP ═══ */
function App(){
  const [tab,setTab]=useState('live');
  const [connected,setConnected]=useState(false);
  const [stats,setStats]=useState({heals:0,passed:0,failed:0,steps:0,confs:[]});
  const [logs,setLogs]=useState([]);
  const [fragility,setFragility]=useState([]);
  const [heals,setHeals]=useState([]);
  const [runFile,setRunFile]=useState('');
  const [running,setRunning]=useState(false);
  const logRef=useRef(null);

  const addLog=useCallback((action,selector,status,detail)=>{
    setLogs(prev=>[{time:new Date().toLocaleTimeString('en',{hour12:false}),action,selector,status,detail,id:Date.now()+Math.random()},...prev.slice(0,50)]);
  },[]);

  useEffect(()=>{
    const s=getSocket();
    s.on('connect',()=>setConnected(true));
    s.on('disconnect',()=>setConnected(false));

    s.on('fragility:data',data=>{if(data)setFragility(Array.isArray(data)?data:[]);});
    s.on('run:ready',d=>{setRunFile(d.testFile?.split(/[/\\]/).pop()||'');});
    s.on('run:start',d=>{
      setRunning(true);setStats({heals:0,passed:0,failed:0,steps:0,confs:[]});setLogs([]);setHeals([]);
      setRunFile(d.testFile?.split(/[/\\]/).pop()||'');
    });
    s.on('step:start',d=>addLog(d.action||'action',d.selector||'','running',''));
    s.on('step:pass',d=>{
      setStats(p=>({...p,passed:p.passed+1,steps:p.steps+1}));
      addLog(d.action||'action',d.selector||'','pass','');
    });
    s.on('step:fail',d=>{
      setStats(p=>({...p,failed:p.failed+1,steps:p.steps+1}));
      addLog(d.action||'action',d.selector||'','fail',d.error?.slice(0,40)||'');
    });
    s.on('heal:start',d=>addLog('heal',d.selector||'','info','Calling AI...'));
    s.on('heal:result',d=>{
      if(d.newSelector){
        setHeals(prev=>[{from:d.brokenSelector||d.selector||'?',to:d.newSelector,reason:d.rootCause||'',confidence:d.confidence||0},...prev]);
      }
    });
    s.on('step:healed',d=>{
      const conf=d.extra?.confidence||0;
      setStats(p=>({...p,heals:p.heals+1,failed:Math.max(0,p.failed-1),confs:[...p.confs,conf]}));
      addLog(d.action||'click',d.selector||'','healed',Math.round(conf*100)+'%');
    });
    s.on('run:complete',d=>{setRunning(false);});

    return ()=>{s.removeAllListeners();};
  },[addLog]);

  const triggerRun=()=>{const s=getSocket();s.emit('run:trigger');};
  const stopRun=()=>{const s=getSocket();s.emit('run:stop');};
  const avgConf=stats.confs.length>0?Math.round(stats.confs.reduce((a,b)=>a+b,0)/stats.confs.length*100)+'%':'—';

  return (
    <>
    {/* NAV */}
    <div className="nav">
      <div className="logo"><span className="logo-icon">&#9878;</span>SelfHeal</div>
      <div className="nav-tabs">
        <button className={`nav-tab ${tab==='live'?'active':''}`} onClick={()=>setTab('live')}>Live Run</button>
        <button className={`nav-tab ${tab==='history'?'active':''}`} onClick={()=>setTab('history')}>History</button>
        <button className={`nav-tab ${tab==='config'?'active':''}`} onClick={()=>setTab('config')}>Config</button>
      </div>
      <div className="nav-right">
        <div className="conn"><span className={`conn-dot ${connected?'live':''}`}/>{connected?'Live':'Offline'}</div>
        {runFile&&<span style={{fontSize:10,fontFamily:'var(--mono)',color:'var(--t1)',background:'var(--bg3)',padding:'3px 8px',borderRadius:5,border:'1px solid var(--b2)'}}>{runFile}</span>}
      </div>
    </div>

    {/* BODY */}
    {tab==='live'&&<LiveTab stats={stats} avgConf={avgConf} fragility={fragility} logs={logs} heals={heals} running={running} triggerRun={triggerRun} stopRun={stopRun}/>}
    {tab==='history'&&<HistoryTab/>}
    {tab==='config'&&<ConfigTab/>}

    {/* TICKER */}
    <div className="ticker">
      <div className="tk"><span className="tk-key">HEALS</span><span className="tk-val g">{stats.heals}</span></div>
      <div className="tk"><span className="tk-key">PASSED</span><span className="tk-val g">{stats.passed}</span></div>
      <div className="tk"><span className="tk-key">FAILED</span><span className="tk-val r">{stats.failed}</span></div>
      <div className="tk"><span className="tk-key">CONF</span><span className="tk-val a">{avgConf}</span></div>
      <div className="tk"><span className="tk-key">STATUS</span><span className="tk-val" style={{color:'#fff'}}>{running?'RUNNING':'IDLE'}</span></div>
      <div className="tk-spacer"/>
      <span style={{fontSize:10,color:'var(--t2)',fontFamily:'var(--mono)',paddingRight:16}}>SelfHeal v3.1</span>
    </div>
    </>
  );
}

/* ═══ LIVE TAB ═══ */
function LiveTab({stats,avgConf,fragility,logs,heals,running,triggerRun,stopRun}){
  return (
    <div className="body">
      {/* Sidebar: Fragility + Heals */}
      <div className="sidebar">
        <div className="section-hdr">Fragility Scan</div>
        <div className="scroll">
          {fragility.length===0&&<div style={{color:'var(--t2)',fontSize:10,textAlign:'center',padding:20,fontStyle:'italic'}}>Waiting for scan...</div>}
          {fragility.map((f,i)=>{
            const cls=f.risk==='high'?'hi':f.risk==='low'?'lo':'md';
            return <div className="frag-row" key={i}><span className="frag-sel">{f.selector}</span><div className="frag-bar"><div className={`frag-fill ${cls}`} style={{width:Math.round(f.fragilityScore*100)+'%'}}/></div><span className={`risk ${cls}`}>{f.risk?.toUpperCase()}</span></div>;
          })}
        </div>
        <div className="section-hdr">Heal Log ({heals.length})</div>
        <div className="scroll">
          {heals.length===0&&<div style={{color:'var(--t2)',fontSize:10,textAlign:'center',padding:16,fontStyle:'italic'}}>No heals yet</div>}
          {heals.map((h,i)=>(
            <div className="heal-card" key={i}>
              <div className="heal-from">{h.from}</div>
              <div className="heal-to">{h.to}</div>
              <div className="heal-reason">{h.reason}</div>
              <div className="conf-track"><div className={`conf-fill ${h.confidence<0.6?'low':''}`} style={{width:Math.round(h.confidence*100)+'%'}}/></div>
              <div className={`conf-val ${h.confidence<0.6?'low':''}`}>{Math.round(h.confidence*100)}%</div>
            </div>
          ))}
        </div>
      </div>

      {/* Main: Stats + Log */}
      <div className="main">
        {/* Stats */}
        <div className="stats">
          <div className="stat"><div className="stat-num a">{stats.heals}</div><div className="stat-label">Heals</div></div>
          <div className="stat"><div className="stat-num g">{stats.passed}</div><div className="stat-label">Passed</div></div>
          <div className="stat"><div className="stat-num r">{stats.failed}</div><div className="stat-label">Failed</div></div>
          <div className="stat"><div className="stat-num a">{avgConf}</div><div className="stat-label">Avg Conf</div></div>
          <div className="stat" style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>
            {running
              ?<button className="btn btn-r" onClick={stopRun}>Stop</button>
              :<button className="btn btn-g" onClick={triggerRun}>&#9654; Run</button>}
            <button className="btn btn-o" onClick={()=>{/* reset would go here */}}>Reset</button>
          </div>
        </div>

        {/* Step Log Table */}
        <div className="section-hdr">Step Execution Log <span style={{fontSize:8.5,fontFamily:'var(--mono)',color:'var(--t2)',fontWeight:700}}>{logs.length} STEPS</span></div>
        <div className="log-wrap">
          <table className="log">
            <thead><tr><th>Time</th><th>Action</th><th>Selector</th><th>Status</th><th>Detail</th></tr></thead>
            <tbody>
              {logs.length===0&&<tr><td colSpan={5} style={{textAlign:'center',color:'var(--t2)',padding:20}}>No steps yet — click Run</td></tr>}
              {logs.map(l=>(
                <tr key={l.id} className="row-new">
                  <td style={{color:'var(--t2)'}}>{l.time}</td>
                  <td style={{color:'var(--t0)',fontWeight:600}}>{l.action}</td>
                  <td title={l.selector}>{l.selector?.length>28?l.selector.slice(0,26)+'...':l.selector}</td>
                  <td>{l.status==='pass'&&<span className="pill pass"><span className="dot"/>PASS</span>}{l.status==='fail'&&<span className="pill fail"><span className="dot"/>FAIL</span>}{l.status==='healed'&&<span className="pill healed"><span className="dot"/>HEALED</span>}{l.status==='info'&&<span className="pill info"><span className="dot"/>INFO</span>}{l.status==='running'&&<span style={{color:'var(--a)',fontSize:10}}>Running...</span>}</td>
                  <td style={{color:l.status==='healed'?'var(--a)':l.status==='pass'?'var(--g)':'var(--r)'}}>{l.detail||'—'}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

/* ═══ HISTORY TAB ═══ */
function HistoryTab(){
  const [history,setHistory]=useState([]);
  useEffect(()=>{fetch('/api/history').then(r=>r.json()).then(d=>setHistory(d.history||[])).catch(()=>{});},[]);
  return (
    <div style={{flex:1,overflow:'auto',padding:20}}>
      <div style={{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',color:'var(--t2)',marginBottom:12}}>Run History</div>
      {history.length===0&&<div style={{color:'var(--t2)',textAlign:'center',padding:40}}>No runs recorded yet.</div>}
      <table className="log" style={{width:'100%'}}>
        <thead><tr><th>Date</th><th>File</th><th>Steps</th><th>Healed</th><th>Failed</th><th>Stability</th></tr></thead>
        <tbody>
          {history.map((r,i)=>(
            <tr key={i}>
              <td style={{color:'var(--t2)',fontSize:9.5}}>{new Date(r.timestamp).toLocaleString()}</td>
              <td>{r.testFile}</td>
              <td style={{textAlign:'center'}}>{r.totalSteps}</td>
              <td style={{textAlign:'center',color:'var(--a)'}}>{r.healed}</td>
              <td style={{textAlign:'center',color:r.failed>0?'var(--r)':'var(--t2)'}}>{r.failed}</td>
              <td style={{textAlign:'center',color:'var(--g)'}}>{r.stabilityScore}/100</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

/* ═══ CONFIG TAB ═══ */
function ConfigTab(){
  return (
    <div style={{flex:1,overflow:'auto',padding:20,maxWidth:660}}>
      <div style={{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',color:'var(--t2)',marginBottom:12}}>Agent Configuration</div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        <div style={{background:'var(--bg2)',border:'1px solid var(--b)',borderRadius:8,padding:14}}>
          <div style={{fontSize:10,color:'var(--t2)',marginBottom:6}}>AI Model</div>
          <select style={{width:'100%',padding:'6px 8px',background:'var(--bg3)',border:'1px solid var(--b2)',borderRadius:4,color:'var(--t0)',fontSize:11}}>
            <option>gemini-2.5-flash</option><option>gemini-1.5-flash</option>
          </select>
        </div>
        <div style={{background:'var(--bg2)',border:'1px solid var(--b)',borderRadius:8,padding:14}}>
          <div style={{fontSize:10,color:'var(--t2)',marginBottom:6}}>Confidence Threshold</div>
          <input type="number" min="50" max="99" defaultValue="80" style={{width:80,padding:'6px 8px',background:'var(--bg3)',border:'1px solid var(--b2)',borderRadius:4,color:'var(--t0)',fontSize:11}}/>
          <span style={{fontSize:10,color:'var(--t1)',marginLeft:6}}>%</span>
        </div>
      </div>
      <div style={{marginTop:20}}>
        <div style={{fontSize:10,color:'var(--t2)',marginBottom:8}}>CLI Quick Reference</div>
        <div style={{background:'var(--bg3)',border:'1px solid var(--b)',borderRadius:6,padding:12,fontFamily:'var(--mono)',fontSize:10.5,color:'var(--g)',lineHeight:1.8}}>
          <span style={{color:'var(--t2)'}}>## Wrap any command</span><br/>
          selfheal npm run dev<br/>
          selfheal npm run build<br/><br/>
          <span style={{color:'var(--t2)'}}>## Run Playwright test</span><br/>
          selfheal run tests/checkout.spec.js --dashboard<br/><br/>
          <span style={{color:'var(--t2)'}}>## Fragility scan</span><br/>
          selfheal scan tests/checkout.spec.js
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
