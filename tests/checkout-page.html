<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SelfHeal Checkout - v2.0 (Broken Selectors Demo)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap');
        body { font-family: 'Outfit', sans-serif; background: #0f172a; color: #f1f5f9; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .input-group input { background: #1e293b; border: 1px solid #334155; padding: 0.75rem; border-radius: 0.5rem; width: 100%; color: white; }
        .btn-fancy { background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%); transition: transform 0.2s; }
        .btn-fancy:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="glass max-w-md w-full p-8 rounded-3xl shadow-2xl">
        <div class="mb-8 text-center">
            <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-sky-400 to-blue-500">Secure Checkout</h1>
            <p class="text-slate-400 mt-2">V2.0 Update: New Dynamic Layout</p>
        </div>

        <div class="space-y-6">
            <!-- Selector changed from #login-email (V1) to #auth-user-email (V2) -->
            <div class="input-group">
                <label class="block text-sm font-medium mb-2 text-slate-300">Email Address</label>
                <input type="email" id="auth-user-email" placeholder="alex@example.com">
            </div>

            <!-- Selector changed from #login-password (V1) to #auth-user-pass (V2) -->
            <div class="input-group">
                <label class="block text-sm font-medium mb-2 text-slate-300">Password</label>
                <input type="password" id="auth-user-pass" placeholder="••••••••">
            </div>

            <!-- Selector changed from #login-btn (V1) to #btn-authenticate (V2) -->
            <button id="btn-authenticate" class="w-full py-3 rounded-xl font-bold text-lg bg-slate-700 hover:bg-slate-600 transition-colors">
                Sign In securely
            </button>

            <div class="border-t border-slate-700/50 my-6"></div>

            <div class="bg-slate-800/50 p-4 rounded-xl border border-slate-700/50 mb-6 flex justify-between items-center">
                <div>
                    <h3 class="font-bold text-sky-400">SelfHeal Pro License</h3>
                    <p class="text-sm text-slate-400">$499.00 / year</p>
                </div>
                <!-- Selector changed from #add-cart (V1) to .action-add-item (V2) -->
                <button class="action-add-item px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-sm font-bold shadow-lg text-emerald-50">
                    Add to Cart
                </button>
            </div>

            <!-- Broken Structural Selector Demo: This was previously #place-order in V1 -->
            <div class="new-container-wrap mt-8">
                <button id="checkout-submit" class="w-full py-4 rounded-xl font-bold text-lg btn-fancy shadow-lg shadow-blue-500/20">
                    Complete Purchase
                </button>
            </div>
            
            <div id="order-confirm-status" class="hidden mt-6 p-4 bg-emerald-500/20 border border-emerald-500/50 rounded-xl text-center text-emerald-400 font-semibold">
                🎉 Order placed successfully!
            </div>
        </div>
    </div>

    <script>
        document.getElementById('checkout-submit').addEventListener('click', () => {
            const btn = document.getElementById('checkout-submit');
            btn.innerHTML = '<span class="animate-pulse">Processing...</span>';
            btn.disabled = true;
            setTimeout(() => {
                btn.classList.add('hidden');
                document.getElementById('order-confirm-status').classList.remove('hidden');
            }, 1000);
        });
    </script>
</body>
</html>
